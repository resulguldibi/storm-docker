version: '3.1'

services:
    zookeeper:
        image: resulguldibi/zookeeper
        container_name: zookeeper
        restart: always
    kafka:
        image: resulguldibi/kafka
        container_name: kafka
        depends_on:
            - zookeeper
        links:
            - zookeeper
        restart: always
        ports:
            - 9092:9092
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ADVERTISED_HOST_NAME: localhost
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    nimbus:
        image: resulguldibi/nimbus
        container_name: nimbus
        command: bash -c "storm nimbus"
        depends_on:
            - zookeeper
        links:
            - zookeeper
        restart: always
        ports:
            - 6627:6627
        volumes:
            - './docker-infra/nimbus/logs:/logs'
            - './docker-infra/nimbus/data:/data'
            - './docker-infra/nimbus/storm.yaml:/conf/storm.yaml'
    ui:
        image: resulguldibi/ui
        container_name: ui
        command: storm ui
        depends_on:
            - nimbus
        links:
            - nimbus
        restart: always
        ports:
           - 8080:8080
           - 8000:8000
        volumes:
            - './docker-infra/ui/logs:/logs'
            - './docker-infra/ui/data:/data'
            - './docker-infra/ui/storm.yaml:/conf/storm.yaml'
    supervisor:
        image: resulguldibi/supervisor
        container_name: supervisor
        command: storm supervisor
        depends_on:
            - nimbus
            - zookeeper
        links:
            - nimbus
            - zookeeper
            - kafka
        restart: always
        volumes:
            - './docker-infra/supervisor/logs:/logs'
            - './docker-infra/supervisor/data:/data'
            - './docker-infra/supervisor/storm.yaml:/conf/storm.yaml'
    maven:
        image: resulguldibi/maven
        container_name: maven
        volumes:
            - './source-code/storm-topologies:/source-code/storm-topologies'
            - './docker-infra/maven/.m2:/root/.m2'
            - './docker-infra/maven/output:/output'
